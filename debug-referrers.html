<!DOCTYPE html>
<html>
<head>
    <title>API Debugger</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .record { border: 1px solid #ccc; padding: 10px; margin: 10px 0; background: #f9f9f9; }
    </style>
</head>
<body>
    <h1>API Debugger</h1>
    <button onclick="runDebug()">Run Diagnostic</button>
    <div id="output"></div>

    <script>
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = msg;
            document.getElementById('output').appendChild(div);
        }

        function runDebug() {
            document.getElementById('output').innerHTML = 'Fetching data...';
            
            // Add cache buster
            fetch('api/get-master-data.php?t=' + Date.now())
                .then(response => {
                    log(`Status: ${response.status} ${response.statusText}`);
                    return response.text().then(text => {
                        try {
                            return JSON.parse(text);
                        } catch (e) {
                            log(`JSON Parse Error: ${e.message}`, 'error');
                            log(`Raw response preview: ${text.substring(0, 500)}...`, 'error');
                            throw e;
                        }
                    });
                })
                .then(data => {
                    log(`Data received. Success: ${data.success}`);
                    
                    if (!data.projects) {
                        log('No "projects" key in response!', 'error');
                        return;
                    }

                    const projects = Object.values(data.projects);
                    log(`Total Projects: ${projects.length}`);

                    let foundMary = false;
                    let referrerCount = 0;

                    projects.forEach(p => {
                        if (p._sourceTable === 'referrers') {
                            referrerCount++;
                        }

                        // Check for Mary Jo
                        const jsonStr = JSON.stringify(p).toLowerCase();
                        if (jsonStr.includes('mary') && jsonStr.includes('jo')) {
                            foundMary = true;
                            const pre = document.createElement('pre');
                            pre.className = 'record';
                            pre.textContent = JSON.stringify(p, null, 2);
                            document.getElementById('output').appendChild(pre);
                            log('FOUND MARY JO!', 'success');
                        }
                    });

                    log(`Total Referrers Source: ${referrerCount}`);
                    
                    if (!foundMary) {
                        log('Mary Jo NOT found in response.', 'error');
                    }
                })
                .catch(err => {
                    log(`Fetch Error: ${err.message}`, 'error');
                });
        }
        
        // Auto-run
        runDebug();
    </script>
</body>
</html>
