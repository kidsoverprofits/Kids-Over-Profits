---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp -R api $DEPLOYPATH
    - /bin/cp -R inc $DEPLOYPATH
    - /bin/cp -R css $DEPLOYPATH
    - /bin/cp -R js $DEPLOYPATH
    - /bin/cp -R docs $DEPLOYPATH
    - /bin/cp -R templates $DEPLOYPATH
    - /bin/cp functions.php $DEPLOYPATH
    - /bin/cp style.css $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp .env.example $DEPLOYPATH
    # Page templates moved into templates/ -- remove stranded copies at theme root
    # so WordPress does not see duplicate Template Name entries.
    - /bin/rm -f $DEPLOYPATH/page-admin-data.php
    - /bin/rm -f $DEPLOYPATH/page-admin-submissions.php
    - /bin/rm -f $DEPLOYPATH/page-admin-lawsuits.php
    - /bin/rm -f $DEPLOYPATH/page-admin-legislation.php
    - /bin/rm -f $DEPLOYPATH/page-data.php
    - /bin/rm -f $DEPLOYPATH/page-location-index.php
    - /bin/rm -f $DEPLOYPATH/page-news-feed.php
    - /bin/rm -f $DEPLOYPATH/page-news-processor.php
    - /bin/rm -f $DEPLOYPATH/page-referrer-index.php
    - /bin/rm -f $DEPLOYPATH/page-state.php
    - /bin/rm -f $DEPLOYPATH/page-state-reports.php
    - /bin/rm -f $DEPLOYPATH/page-tti-program-index.php
    - /bin/rm -f $DEPLOYPATH/page-wiki-editor.php
    - /bin/rm -f $DEPLOYPATH/page-wiki-feed.php
