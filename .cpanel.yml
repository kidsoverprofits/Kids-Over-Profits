---
deployment:
  tasks:
    # 1. Ensure the destination directory exists
    - /bin/mkdir -p /home/kidsover/public_html/wp-content/themes/child/

    # 2. Sync files using rsync (FASTER than cp)
    - /usr/bin/rsync -av --exclude '.git' --exclude '.cpanel.yml' --exclude '.DS_Store' --exclude 'README.md' --exclude 'AGENTS.md' --exclude 'CLAUDE.md' --exclude 'markdown_output' --exclude 'scripts' --exclude 'tests' ./ /home/kidsover/public_html/wp-content/themes/child/

    # 3. Post-sync Cleanup - remove WP core files if accidentally synced
    - /bin/rm -f /home/kidsover/public_html/wp-content/themes/child/wp-config.php 2>/dev/null || true
    - /bin/rm -rf /home/kidsover/public_html/wp-content/themes/child/wp-admin 2>/dev/null || true
    - /bin/rm -rf /home/kidsover/public_html/wp-content/themes/child/wp-includes 2>/dev/null || true

    # 4. Fix directory permissions (755 for web access)
    - /usr/bin/find /home/kidsover/public_html/wp-content/themes/child -type d -exec chmod 755 {} \;

    # 5. Fix file permissions (644 for web access)
    - /usr/bin/find /home/kidsover/public_html/wp-content/themes/child -type f -exec chmod 644 {} \;

    # 6. Secure sensitive files
    - /bin/chmod 600 /home/kidsover/public_html/wp-content/themes/child/.env 2>/dev/null || true
    - /bin/chmod 600 /home/kidsover/public_html/wp-content/themes/child/api/config.local.php 2>/dev/null || true

    # 7. Ensure .env exists (copy from example if missing)
    - if [ ! -f /home/kidsover/public_html/wp-content/themes/child/.env ]; then cp /home/kidsover/public_html/wp-content/themes/child/.env.example /home/kidsover/public_html/wp-content/themes/child/.env 2>/dev/null || true; fi

    - echo "Deployment Complete"
