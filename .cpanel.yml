    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp page-wiki-feed.php "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp submissions_database.sql "$DEPLOYPATH"'
