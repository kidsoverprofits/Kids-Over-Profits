---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp -R api $DEPLOYPATH
    - /bin/cp -R css $DEPLOYPATH
    - /bin/cp -R js $DEPLOYPATH
    - /bin/cp -R docs $DEPLOYPATH
    - /bin/cp -R templates $DEPLOYPATH
    - /bin/cp -R seeds $DEPLOYPATH
    # The discovery cron's rejected log used to be tracked as
    # scripts/discovery-rejected.json; it now lives at the gitignored
    # scripts/.discovery-rejected.json. Carry the live server copy over once,
    # then drop the stale tracked file so it stops shadowing the new one.
    - if [ -f $DEPLOYPATH/scripts/discovery-rejected.json ] && [ ! -f $DEPLOYPATH/scripts/.discovery-rejected.json ]; then /bin/mv $DEPLOYPATH/scripts/discovery-rejected.json $DEPLOYPATH/scripts/.discovery-rejected.json; fi
    - /bin/cp -R scripts $DEPLOYPATH
    - /bin/rm -f $DEPLOYPATH/scripts/discovery-rejected.json
    # wiki-stubs.php reads markdown_output/empty_files_updated.md server-side to
    # know which wiki pages are still stubs. Ship that one file (the full
    # markdown_output/ dir is large and not otherwise needed in the theme).
    - /bin/mkdir -p $DEPLOYPATH/markdown_output
    - /bin/cp markdown_output/empty_files_updated.md $DEPLOYPATH/markdown_output/
    # KOP Tools plugin lives outside the theme — deploy it to wp-content/plugins/.
    - export PLUGINPATH=/home/kidsover/public_html/wp-content/plugins/kop-tools/
    - /bin/mkdir -p $PLUGINPATH
    - /bin/cp -R wp-plugins/kop-tools/. $PLUGINPATH
    # inc/ carries the versioned init step (inc/admin.php). It is copied last so
    # a request during the deploy never runs a new version before the files it
    # expects (templates, seeds, css, js) are in place.
    - /bin/cp -R inc $DEPLOYPATH
    - /bin/cp functions.php $DEPLOYPATH
    - /bin/cp search.php $DEPLOYPATH
    - /bin/cp style.css $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp .env.example $DEPLOYPATH
    # Page templates moved into templates/ -- remove stranded copies at theme root
    # so WordPress does not see duplicate Template Name entries.
    - /bin/rm -f $DEPLOYPATH/page-admin-data.php
    - /bin/rm -f $DEPLOYPATH/page-admin-submissions.php
    - /bin/rm -f $DEPLOYPATH/page-admin-lawsuits.php
    - /bin/rm -f $DEPLOYPATH/page-admin-legislation.php
    - /bin/rm -f $DEPLOYPATH/page-data.php
    - /bin/rm -f $DEPLOYPATH/page-location-index.php
    - /bin/rm -f $DEPLOYPATH/page-news-feed.php
    - /bin/rm -f $DEPLOYPATH/page-news-processor.php
    - /bin/rm -f $DEPLOYPATH/page-referrer-index.php
    - /bin/rm -f $DEPLOYPATH/page-state.php
    - /bin/rm -f $DEPLOYPATH/page-state-reports.php
    - /bin/rm -f $DEPLOYPATH/page-tti-program-index.php
    - /bin/rm -f $DEPLOYPATH/page-wiki-editor.php
    - /bin/rm -f $DEPLOYPATH/page-wiki-feed.php
    # Files deleted from the repo are not removed by the cp -R tasks above;
    # list them here so production does not keep serving orphaned copies.
    - /bin/rm -f $DEPLOYPATH/edcons-display.js
    - /bin/rm -f $DEPLOYPATH/js/edcons-display.js
    - /bin/rm -f $DEPLOYPATH/js/referrer-index.js
    - /bin/rm -f $DEPLOYPATH/js/data-form/admin-data-page.js
    - /bin/rm -f $DEPLOYPATH/templates/fetch-bill-details.php
    # Debug and test endpoints removed 2026-09-17 (no auth, exposed server
    # paths and data, one purged the LiteSpeed cache on request).
    - /bin/rm -f $DEPLOYPATH/delete-git.php
    - /bin/rm -f $DEPLOYPATH/api/clear-cache.php
    - /bin/rm -f $DEPLOYPATH/api/debug-master-data.php
    - /bin/rm -f $DEPLOYPATH/api/test-connection.php
    - /bin/rm -f $DEPLOYPATH/api/test-get.php
    - /bin/rm -f $DEPLOYPATH/api/debug-recent-projects.php
    - /bin/rm -f $DEPLOYPATH/api/validate-json.php
    # Dead Kadence nav-guard workaround removed 2026-09-17 (root cause fixed by
    # the theme_mod_header_sticky_shrink filter in inc/enqueue.php).
    - /bin/rm -f $DEPLOYPATH/js/data-form/kadence-nav-guard.js
    # /favicon.ico is answered by LiteSpeed before WordPress (its own 404 page),
    # so WordPress core's Site Icon redirect never runs. Ship a physical file
    # built from the Site Icon (attachment 3455) to the web root.
    - /bin/cp favicon.ico /home/kidsover/public_html/favicon.ico
