---
deployment:
  tasks:
    # Remove WordPress content snippet files that shouldn't be deployed
    - /bin/rm -f /home/kidsover/public_html/wp-content/themes/child/tti-program-index
    - /bin/rm -f /home/kidsover/public_html/wp-content/themes/child/data

    # Remove any WordPress core files that shouldn't be in child theme
    - /bin/rm -f /home/kidsover/public_html/wp-content/themes/child/wp-*.php
    - /bin/rm -f /home/kidsover/public_html/wp-content/themes/child/index.php
    - /bin/rm -f /home/kidsover/public_html/wp-content/themes/child/xmlrpc.php
    - /bin/rm -rf /home/kidsover/public_html/wp-content/themes/child/wp-content
    - /bin/rm -rf /home/kidsover/public_html/wp-content/themes/child/wp-includes
    - /bin/rm -rf /home/kidsover/public_html/wp-content/themes/child/wp-admin

    # Copy specific directories
    - /bin/cp -R api /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp -R inc /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp -R css /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp -R js /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp -R images /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp -R templates /home/kidsover/public_html/wp-content/themes/child/

    # Copy child theme PHP files
    - /bin/cp functions.php /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp page-*.php /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp style.css /home/kidsover/public_html/wp-content/themes/child/

    # Copy config and hidden files
    - /bin/cp .htaccess /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp .gitignore /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp .env.example /home/kidsover/public_html/wp-content/themes/child/
    - /bin/cp config-loader.php /home/kidsover/public_html/wp-content/themes/child/

    # Set proper permissions
    - /bin/chmod 644 /home/kidsover/public_html/wp-content/themes/child/*.php
    - /bin/chmod 600 /home/kidsover/public_html/wp-content/themes/child/.env
    - /bin/chmod 600 /home/kidsover/public_html/wp-content/themes/child/api/config.local.php

    # Ensure .env exists on server (create from example if missing)
    - test -f /home/kidsover/public_html/wp-content/themes/child/.env || /bin/cp /home/kidsover/public_html/wp-content/themes/child/.env.example /home/kidsover/public_html/wp-content/themes/child/.env

    # Output deployment confirmation
    - echo "Deployment complete to child theme directory"