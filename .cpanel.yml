---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kidsover/public_html/wp-content/themes/child/
    - /bin/mkdir -p "$DEPLOYPATH"
    - export SRCPATH="$(pwd -P)"
    - export DESTPATH="$(cd "$DEPLOYPATH" 2>/dev/null && pwd -P)"
    - '[ "$SRCPATH" = "$DESTPATH" ] && /bin/echo "Repo path equals deploy path; skipping copy tasks." || /bin/rm -rf "$DEPLOYPATH/.git"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp -R api "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp -R inc "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp -R css "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp -R js "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp -R templates "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp -R docs "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp functions.php "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp style.css "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp .htaccess "$DEPLOYPATH"'
    - '[ "$SRCPATH" = "$DESTPATH" ] || /bin/cp page-admin-data.php "$DEPLOYPATH"'
