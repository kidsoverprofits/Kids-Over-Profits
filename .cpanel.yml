---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kidsover/public_html/wp-content/themes/child
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R api $DEPLOYPATH/
    - /bin/cp -R css $DEPLOYPATH/
    - /bin/cp -R inc $DEPLOYPATH/
    - /bin/cp -R js $DEPLOYPATH/
    - /bin/cp -R templates $DEPLOYPATH/
    - /bin/cp -R docs $DEPLOYPATH/
    - /bin/cp *.php $DEPLOYPATH/
    - /bin/cp *.css $DEPLOYPATH/
    - /bin/cp *.js $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp *.sql $DEPLOYPATH/ 2>/dev/null || true
    - /bin/rm -f $DEPLOYPATH/.cpanel.yml
    - /usr/bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 {} \;
    - /usr/bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 {} \;
    - /bin/echo "Deployment completed successfully"
