---
deployment:
  tasks:
    # 1. Ensure the destination directory exists
    - /bin/mkdir -p /home/kidsover/public_html/wp-content/themes/child/

    # 2. Sync files using rsync (FASTER and SAFER than cp)
    #    -a: archive mode (preserves permissions, times, recursive)
    #    -v: verbose
    #    --delete: remove files on destination that don't exist on source (optional, use with care)
    #    --exclude: don't copy these files
    - /usr/bin/rsync -av --exclude '.git' --exclude '.cpanel.yml' --exclude '.DS_Store' --exclude 'README.md' --exclude 'AGENTS.md' --exclude 'markdown_output' --exclude 'scripts' --exclude 'tests' ./ /home/kidsover/public_html/wp-content/themes/child/

    # 3. Post-sync Cleanup (optional, since rsync handles most)
    #    These ensure we didn't accidentally sync core WP files if they were locally present
    - /bin/rm -f /home/kidsover/public_html/wp-content/themes/child/wp-config.php
    - /bin/rm -rf /home/kidsover/public_html/wp-content/themes/child/wp-admin
    - /bin/rm -rf /home/kidsover/public_html/wp-content/themes/child/wp-includes

    # 4. Set Permissions
    #    Find all PHP files and set to 644
    - /usr/bin/find /home/kidsover/public_html/wp-content/themes/child/ -name "*.php" -type f -exec chmod 644 {} \;
    #    Secure the environment file
    - /bin/chmod 600 /home/kidsover/public_html/wp-content/themes/child/.env 2>/dev/null || true

    # 5. Ensure .env exists (copy from example if missing)
    - if [ ! -f /home/kidsover/public_html/wp-content/themes/child/.env ]; then cp /home/kidsover/public_html/wp-content/themes/child/.env.example /home/kidsover/public_html/wp-content/themes/child/.env; fi

    - echo "Deployment Complete via Rsync"