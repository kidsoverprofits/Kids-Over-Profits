<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Modals Demo</title>
    <link rel="stylesheet" href="../../css/data-form.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        .demo-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #33A7B5;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }
        .demo-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
        }
        .demo-section h2 {
            color: #1f2937;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .demo-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #000080 0%, #33A7B5 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        .demo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(51, 167, 181, 0.3);
        }
        .result {
            margin-top: 15px;
            padding: 12px;
            background: white;
            border-left: 4px solid #33A7B5;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>Custom Modal System Demo</h1>
        <p class="subtitle">Beautiful, modern replacements for alert(), confirm(), and prompt()</p>

        <div class="demo-section">
            <h2>Alert Modal</h2>
            <button class="demo-btn" onclick="testAlert()">Show Alert</button>
            <div id="alert-result" class="result" style="display: none;"></div>
        </div>

        <div class="demo-section">
            <h2>Confirm Modal</h2>
            <button class="demo-btn" onclick="testConfirm()">Show Confirm</button>
            <button class="demo-btn" onclick="testCustomConfirm()">Custom Confirm (with labels)</button>
            <div id="confirm-result" class="result" style="display: none;"></div>
        </div>

        <div class="demo-section">
            <h2>Prompt Modal</h2>
            <button class="demo-btn" onclick="testPrompt()">Show Prompt</button>
            <div id="prompt-result" class="result" style="display: none;"></div>
        </div>

        <div class="demo-section">
            <h2>Select Modal (Dropdown)</h2>
            <button class="demo-btn" onclick="testSelect()">Show Select</button>
            <button class="demo-btn" onclick="testSelectWithDescriptions()">Select with Descriptions</button>
            <div id="select-result" class="result" style="display: none;"></div>
        </div>

        <div class="demo-section">
            <h2>Choice Modal (Radio Buttons)</h2>
            <button class="demo-btn" onclick="testChoice()">Show Choice with Descriptions</button>
            <div id="choice-result" class="result" style="display: none;"></div>
        </div>
    </div>

    <script src="custom-modals.js"></script>
    <script>
        function testAlert() {
            customAlert('This is a beautiful alert message!', 'Success').then(() => {
                showResult('alert-result', 'User clicked OK');
            });
        }

        function testConfirm() {
            customConfirm('Do you want to save your changes?', 'Confirm Action').then(result => {
                showResult('confirm-result', `User selected: ${result ? 'OK' : 'Cancel'}`);
            });
        }

        function testCustomConfirm() {
            customConfirm(
                'Is this an independent consultant or part of an agency?',
                'Consultant Type',
                { yesText: 'Independent Consultant', noText: 'Part of Agency' }
            ).then(result => {
                showResult('confirm-result', `User selected: ${result ? 'Independent' : 'Agency'}`);
            });
        }

        function testPrompt() {
            customPrompt('Please enter your project name:', '', 'Project Name').then(result => {
                if (result) {
                    showResult('prompt-result', `User entered: "${result}"`);
                } else {
                    showResult('prompt-result', 'User cancelled');
                }
            });
        }

        function testSelect() {
            const options = [
                { value: '1', label: 'All Companies/Operators' },
                { value: '2', label: 'All Locations/States' },
                { value: '3', label: 'All Referrers' }
            ];

            customSelect('What kind of report would you like to generate?', options, 'Select Report Type').then(result => {
                if (result) {
                    const selected = options.find(opt => opt.value === result);
                    showResult('select-result', `User selected: ${selected.label} (value: ${result})`);
                } else {
                    showResult('select-result', 'User cancelled');
                }
            });
        }

        function testSelectWithDescriptions() {
            const options = [
                { value: 'companies', label: 'All Companies/Operators' },
                { value: 'locations', label: 'All Locations/States' },
                { value: 'referrers', label: 'All Referrers' }
            ];

            const descriptions = {
                'companies': 'Generate a comprehensive report of all company operators in the database',
                'locations': 'Generate a report organized by geographic locations and states',
                'referrers': 'Generate a report of all referrer agencies and consultants'
            };

            customSelect(
                'What kind of report would you like to generate?',
                options,
                'Select Report Type',
                { descriptions }
            ).then(result => {
                if (result) {
                    const selected = options.find(opt => opt.value === result);
                    showResult('select-result', `User selected: ${selected.label} (${result})`);
                } else {
                    showResult('select-result', 'User cancelled');
                }
            });
        }

        function testChoice() {
            const options = [
                {
                    value: '1',
                    label: 'All Companies/Operators',
                    description: 'Generate a comprehensive report of all company operators in the database'
                },
                {
                    value: '2',
                    label: 'All Locations/States',
                    description: 'Generate a report organized by geographic locations and states'
                },
                {
                    value: '3',
                    label: 'All Referrers',
                    description: 'Generate a report of all referrer agencies and consultants'
                }
            ];

            customChoice(
                'No project is currently loaded. What kind of report would you like to generate?',
                options,
                'Select Report Type',
                { type: 'radio' }
            ).then(result => {
                if (result) {
                    const selected = options.find(opt => opt.value === result);
                    showResult('choice-result', `User selected: ${selected.label} (value: ${result})`);
                } else {
                    showResult('choice-result', 'User cancelled');
                }
            });
        }

        function showResult(elementId, message) {
            const resultDiv = document.getElementById(elementId);
            resultDiv.textContent = message;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
