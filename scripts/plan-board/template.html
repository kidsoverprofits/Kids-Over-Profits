<title>KOP Plan Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: one reading column; sticky filter bar; each plan item a card with its answer box underneath. */
:root {
  --bg: #f2eedf;          /* KOP sand */
  --panel: #fffdf6;
  --ink: #000435;         /* midnight */
  --muted: #4a5568;
  --line: #d9d2bb;
  --accent: #1e6f79;      /* teal ink */
  --accent-fill: #1e6f79;
  --on-accent: #ffffff;
  --done: #2f6b2a;
  --later: #8a5a12;
  --answer: #1e6f79;
  --chip-bg: #e9e3cc;
  --code-bg: #ebe5d0;
  --display: "Source Serif 4", Georgia, serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #050a24; --panel: #0d1534; --ink: #ece8da; --muted: #a9b0c2; --line: #263055;
  --accent: #6cc6d1; --accent-fill: #33a7b5; --on-accent: #000435; --done: #8fd283; --later: #f0b45e;
  --answer: #6cc6d1; --chip-bg: #1a2347; --code-bg: #1a2347; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #050a24; --panel: #0d1534; --ink: #ece8da; --muted: #a9b0c2; --line: #263055;
  --accent: #6cc6d1; --accent-fill: #33a7b5; --on-accent: #000435; --done: #8fd283; --later: #f0b45e;
  --answer: #6cc6d1; --chip-bg: #1a2347; --code-bg: #1a2347; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
h1 { font: 700 2rem/1.15 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 14px 0 0; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.stats b { color: var(--ink); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; margin-top: 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
button.tab { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
button.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.tab:focus-visible, button.btn:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
input.search { flex: 1 1 220px; min-width: 0; font: 14px var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
label.chk { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

.pass { margin-top: 22px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 14px 16px; }
.pass h2 { font: 600 1.05rem var(--display); margin: 0 0 6px; }
.pass ul { margin: 0; padding-left: 18px; }
.pass li { margin: 4px 0; }
.pass .res { color: var(--muted); }

section.sec { margin-top: 30px; }
section.sec > h2 { font: 700 1.45rem/1.2 var(--display); margin: 0 0 4px; text-wrap: balance; }
.grp { margin-top: 18px; }
.grp > h3 { font: 600 1.05rem/1.3 var(--display); margin: 0 0 6px; color: var(--ink); }
.intro { color: var(--muted); font-size: 13.5px; margin: 0 0 8px; max-width: 70ch; }
.items { display: flex; flex-direction: column; gap: 10px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.card[data-state="done"] { border-left: 4px solid var(--done); }
.card[data-state="later"] { border-left: 4px solid var(--later); }
.card[data-state="answer"] { border-left: 4px solid var(--answer); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; letter-spacing: .03em; color: var(--muted); margin-bottom: 4px; }
.id { font-family: var(--mono); }
.chip { font: 600 11px var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--chip-bg); }
.chip.done { color: var(--done); } .chip.later { color: var(--later); } .chip.answer { color: var(--answer); }
.text { overflow-wrap: anywhere; }
.text code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
.text a { color: var(--accent); }

.ans { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
textarea { width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical; font: 14px/1.45 var(--body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.saved { background: var(--bg); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.saved .when { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; white-space: normal; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
button.btn { font: 600 13px var(--body); border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
button.btn:hover { background: var(--chip-bg); color: var(--ink); }
button.btn.primary { background: var(--accent-fill); color: var(--on-accent); border-color: var(--accent-fill); }
button.btn.primary:hover { background: var(--accent-fill); color: var(--on-accent); filter: brightness(1.08); }
button.btn:disabled { opacity: .5; cursor: default; }
.note { font-size: 13px; color: var(--muted); }
.err { color: #b3261e; }
.empty { color: var(--muted); padding: 20px 0; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>KOP Plan Board</h1>
    <p class="sub">Every open item in <code>docs/PLAN.md</code>. Type an answer, or mark an item done or not now. Claude reads these on its next pass, folds them into the plan and clears them.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <div class="tabs" id="tabs" role="toolbar" aria-label="Sections"></div>
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Find an item" aria-label="Find an item">
      <label class="chk"><input type="checkbox" id="hideAnswered"> Hide answered</label>
    </div>
  </div>

  <div id="status" class="note" style="margin-top:10px"></div>
  <div id="pass"></div>
  <div id="orphans"></div>
  <main id="list"></main>
</div>

<script>
const PLAN = /*__PLAN__*/null;
const state = { answers: {}, tab: 'all', q: '', hide: false, db: null, canWrite: true, editing: {} };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KIND_LABEL = { done: 'Done', later: 'Not now', answer: 'Answered' };

function md(s) {
  const codes = [];
  let t = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|[^)\s]+)\)/g, (_, txt, url) =>
    /^https?:/.test(url) ? `<a href="${url}" target="_blank" rel="noopener">${txt}</a>` : `${txt} <span class="id">(${url})</span>`);
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}

const allItems = [];
for (const s of PLAN.sections) for (const g of s.groups) for (const it of g.items) allItems.push({ ...it, sec: s.key, grp: g.key });
const itemIds = new Set(allItems.map(i => i.id));
const docId = id => id.replace(/[^A-Za-z0-9_\-.~:@+]/g, '-');

function draftKey(id) { return 'kop-plan-draft:' + id; }
const drafts = {};
function getDraft(id) { if (id in drafts) return drafts[id]; try { return localStorage.getItem(draftKey(id)) || ''; } catch { return ''; } }
function setDraft(id, v) { if (v) drafts[id] = v; else delete drafts[id]; try { v ? localStorage.setItem(draftKey(id), v) : localStorage.removeItem(draftKey(id)); } catch {} }

function renderTabs() {
  const tabs = [['all', 'All']].concat(PLAN.sections.map(s => [s.key, s.key + '. ' + s.title.replace(/^Owner: .*/, 'Owner')]));
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab" type="button" data-tab="${k}" aria-pressed="${state.tab === k}">${esc(l)}</button>`).join('');
}

function renderStats() {
  const answered = allItems.filter(i => state.answers[docId(i.id)]).length;
  const by = k => Object.values(state.answers).filter(a => a.kind === k).length;
  $('#stats').innerHTML = `<span><b>${allItems.length}</b> open items</span><span><b>${answered}</b> answered, waiting for Claude</span>` +
    `<span>${by('answer')} answers, ${by('done')} done, ${by('later')} not now</span><span>Built ${esc(PLAN.built)}</span>`;
}

function matches(it) {
  if (state.tab !== 'all' && it.sec !== state.tab) return false;
  if (state.hide && state.answers[docId(it.id)]) return false;
  if (state.q) { const q = state.q.toLowerCase(); if (!(it.text.toLowerCase().includes(q) || it.id.includes(q))) return false; }
  return true;
}

function cardHtml(it) {
  const a = state.answers[docId(it.id)];
  const editing = state.editing[it.id];
  const kind = a ? a.kind : '';
  let ans;
  if (a && !editing) {
    const when = a.savedAt ? new Date(a.savedAt).toLocaleString() : '';
    ans = `<div class="saved">${a.text ? esc(a.text) : `<em>${KIND_LABEL[a.kind]}</em>`}<span class="when">${KIND_LABEL[a.kind]}${when ? ', saved ' + esc(when) : ''}. Claude folds it in on the next pass.</span></div>
      <div class="btns"><button class="btn" type="button" data-act="edit">Change</button><button class="btn" type="button" data-act="withdraw">Withdraw</button></div>`;
  } else {
    const val = editing && a ? (a.text || '') : getDraft(it.id);
    ans = `<textarea id="ta-${esc(docId(it.id))}" aria-label="Your answer" placeholder="Your answer, a decision, a correction, or what happened">${esc(val)}</textarea>
      <div class="btns"><button class="btn primary" type="button" data-act="answer">Save answer</button>
      <button class="btn" type="button" data-act="done">Done</button><button class="btn" type="button" data-act="later">Not now</button>
      ${editing ? '<button class="btn" type="button" data-act="cancel">Cancel</button>' : ''}</div>`;
  }
  return `<article class="card" data-id="${esc(it.id)}" data-state="${kind}">
    <div class="meta"><span class="id">${esc(it.id)}</span>${kind ? `<span class="chip ${kind}">${KIND_LABEL[kind]}</span>` : ''}</div>
    <div class="text">${md(it.text)}</div>
    <div class="ans">${state.canWrite ? ans : (a ? `<div class="saved">${esc(a.text || KIND_LABEL[a.kind])}</div>` : '')}</div>
  </article>`;
}

function renderList() {
  let html = '';
  for (const s of PLAN.sections) {
    if (state.tab !== 'all' && s.key !== state.tab) continue;
    let sh = '';
    for (const g of s.groups) {
      const items = g.items.map(it => ({ ...it, sec: s.key })).filter(matches);
      if (!items.length) continue;
      sh += `<div class="grp">${g.title ? `<h3>${/^\d+\.\d+$/.test(g.key) ? esc(g.key) + ' ' : ''}${esc(g.title)}</h3>` : ''}
        ${g.intro.map(p => `<p class="intro">${md(p)}</p>`).join('')}
        <div class="items">${items.map(cardHtml).join('')}</div></div>`;
    }
    if (sh) html += `<section class="sec"><h2>${esc(s.key)}. ${esc(s.title)}</h2>${sh}</section>`;
  }
  $('#list').innerHTML = html || '<p class="empty">Nothing matches.</p>';
}

function renderOrphans() {
  const lost = Object.entries(state.answers).filter(([k]) => !allItems.some(i => docId(i.id) === k));
  $('#orphans').innerHTML = lost.length ? `<div class="pass"><h2>Answers to items no longer on the board</h2><ul>${lost.map(([k, a]) =>
    `<li><span class="id">${esc(k)}</span>: ${esc(a.text || KIND_LABEL[a.kind])}</li>`).join('')}</ul><p class="note">Claude still reads these on its next pass.</p></div>` : '';
}

function renderPass(p) {
  if (!p || !p.entries || !p.entries.length) { $('#pass').innerHTML = ''; return; }
  $('#pass').innerHTML = `<div class="pass"><h2>Last pass, ${esc(p.at || '')}</h2><ul>${p.entries.map(e =>
    `<li><strong>${esc(e.lead || e.itemId)}</strong> <span class="chip ${esc(e.kind)}">${KIND_LABEL[e.kind] || ''}</span>${e.text ? ': ' + esc(e.text) : ''}<br><span class="res">${md(e.result || '')}</span></li>`).join('')}</ul></div>`;
}

function render() { renderTabs(); renderStats(); renderOrphans(); renderList(); }

function setStatus(msg, isErr) { const el = $('#status'); el.textContent = msg || ''; el.className = 'note' + (isErr ? ' err' : ''); }

async function save(it, kind) {
  if (!state.db) { setStatus('Saving is not available in this view. Open the board on claude.ai while signed in.', true); return; }
  const ta = document.getElementById('ta-' + docId(it.id));
  const text = ta ? ta.value.trim() : '';
  if (kind === 'answer' && !text) { setStatus('Type an answer first, or use Done or Not now.', true); ta && ta.focus(); return; }
  const body = { itemId: it.id, lead: it.lead, kind, text, savedAt: new Date().toISOString() };
  try {
    await state.db.collection('answers').doc(docId(it.id)).set(body);
    setDraft(it.id, ''); delete state.editing[it.id];
    state.answers[docId(it.id)] = body; render(); setStatus('Saved.');
  } catch (e) {
    if (e && e.code === 'invalid_argument') { state.canWrite = false; render(); setStatus('This view can read the board but not save to it.', true); }
    else setStatus('Could not save (' + ((e && e.code) || 'error') + '). Try again in a moment.', true);
  }
}

async function withdraw(it) {
  try { await state.db.collection('answers').doc(docId(it.id)).delete(); delete state.answers[docId(it.id)]; render(); setStatus('Withdrawn.'); }
  catch (e) { setStatus('Could not withdraw (' + ((e && e.code) || 'error') + ').', true); }
}

document.addEventListener('click', e => {
  const tab = e.target.closest('button.tab');
  if (tab) { state.tab = tab.dataset.tab; render(); return; }
  const b = e.target.closest('button.btn'); if (!b) return;
  const card = b.closest('.card'); if (!card) return;
  const it = allItems.find(i => i.id === card.dataset.id); if (!it) return;
  const act = b.dataset.act;
  if (act === 'answer' || act === 'done' || act === 'later') save(it, act);
  else if (act === 'withdraw') withdraw(it);
  else if (act === 'edit') { state.editing[it.id] = true; render(); }
  else if (act === 'cancel') { delete state.editing[it.id]; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value.trim(); renderList(); return; }
  if (e.target.tagName === 'TEXTAREA') { const card = e.target.closest('.card'); if (card && !state.editing[card.dataset.id]) setDraft(card.dataset.id, e.target.value); }
});
$('#hideAnswered').addEventListener('change', e => { state.hide = e.target.checked; renderList(); });

render();
setStatus('Connecting to the saved answers...');
(async () => {
  const db = await (window.claude && window.claude.use ? window.claude.use('db') : null);
  if (!db) { state.canWrite = false; render(); setStatus('Saved answers are not available in this view. Open the board on claude.ai while signed in.', true); return; }
  state.db = db;
  try {
    const user = await window.claude.use('user');
    const can = user ? await user.can('data.write') : null;
    if (can === false) { state.canWrite = false; }
  } catch {}
  setStatus('');
  db.collection('answers').onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { next[d.id] = d.data(); });
    state.answers = next; renderStats(); renderOrphans(); renderList();
  }, err => setStatus('Lost the connection to saved answers (' + err.code + '). Reload the page.', true));
  db.collection('passes').orderBy('at', 'desc').limit(1).onSnapshot(snap => renderPass(snap.docs[0] && snap.docs[0].data()), () => {});
})();
</script>
